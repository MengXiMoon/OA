<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfcfc" />
    <title>OA 办公自动化系统</title>
    <style>
      #app-loading {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #fcfcfc;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1f1f1f;
      }
      #app-loading .logo {
        font-size: 48px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      #app-loading .sub {
        font-size: 14px;
        color: #a1a7ad;
        letter-spacing: 0.08em;
      }
      #app-loading .dots {
        margin-top: 32px;
        display: flex;
        gap: 8px;
      }
      #app-loading .dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: #d0d0ce;
        animation: pulse 1.2s ease-in-out infinite;
      }
      #app-loading .dot:nth-child(2) { animation-delay: 0.2s; }
      #app-loading .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pulse {
        0%, 100% { background: #d0d0ce; }
        50% { background: #1f1f1f; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="logo">OA</div>
        <div class="sub">办公自动化系统</div>
        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
